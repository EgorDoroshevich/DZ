@if (isLoading()) {
  <div class="flex w-full items-center justify-center h-screen">
    <mat-spinner></mat-spinner>
  </div>
} @else {
  <div class="main-container w-full">
    <div class="flex items-center justify-center w-200">
      <h1>To Do List</h1>
    </div>
    <div class="flex gap-5">
      <div class="flex items-center justify-between w-200 descriptions">
        @for (item of items(); track item.id) {
          <app-todo-item
            [appTooltip]="item.description"
            [id]="item.id"
            [description]="item.description"
            [text]="item.text"
            [selectedItemId]="selectedItemId()"
            (selectItem)="selectItem($event)"
            (buttonClick)="deleteNote(item.id)"
          ></app-todo-item>
        }
      </div>
      <div
        class="mt-4 w-100 h-85 border border-black bg-amber-100 flex items-center justify-center"
      >
        @for (item of items(); track item.id) {
          @if (selectedItemId() === item.id && selectedItemId !== null) {
            {{ item.description }}
          }
        }
      </div>
    </div>
    <div class="flex items-center justify-between w-200">
      <mat-form-field>
        <mat-label>Напишите заметку</mat-label>
        <input name="note" matInput [(ngModel)]="note" />
      </mat-form-field>

      <mat-form-field>
        <mat-label>Textarea</mat-label>
        <textarea matInput name="description" [(ngModel)]="description"></textarea>
      </mat-form-field>
      <app-button
        [appTooltip]="'Добавить заметку'"
        [title]="'Добавить'"
        (buttonClick)="addNote()"
        [addButton]="true"
        [isDisabled]="note.length === 0 && description.length === 0"
      />
    </div>
  </div>
}
